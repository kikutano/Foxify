name: Feature request
description: Something tinyprobe can't do yet, in the format, the CLI or the guide for agents.
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Check the [roadmap](https://github.com/kikutano/tinyprobe/blob/main/ROADMAP.md) first: it may be planned already. If so, comment on what you need from it here.
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to test, and what gets in the way today.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: How it could look
      description: The YAML or the command you would like to write, if you have an idea.
      render: yaml
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today
      description: Workarounds, or how another tool (Postman, Bruno, Hurl, k6, ...) does it.
