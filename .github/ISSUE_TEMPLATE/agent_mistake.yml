name: Agent mistake
description: A coding agent wrote wrong tinyprobe files, or got stuck converting a collection, an OpenAPI document or a backend.
labels: [agent mistake]
body:
  - type: markdown
    attributes:
      value: |
        tinyprobe relies on your coding agent to write endpoints and workflows, and to convert what you already have. When an agent gets it wrong, the guide it reads (`tinyprobe guide`, [docs/llm-guide.md](https://github.com/kikutano/tinyprobe/blob/main/docs/llm-guide.md)) can usually be improved. These reports are how we find out what to fix.
  - type: input
    id: agent
    attributes:
      label: Agent and model
      placeholder: Claude Code with Claude Sonnet 5.5, Cursor with ..., GitHub Copilot with ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: tinyprobe version
      description: The output of `tinyprobe --version`.
      placeholder: 0.10.0
    validations:
      required: true
  - type: dropdown
    id: source
    attributes:
      label: What the agent started from
      options: [Backend code, Postman collection, OpenAPI / Swagger, Insomnia, Bruno, HAR or curl, A description in the chat, Other]
    validations:
      required: true
  - type: dropdown
    id: guide
    attributes:
      label: Did the agent read the guide?
      options: [Yes (tinyprobe guide or the link), "No", Not sure]
    validations:
      required: true
  - type: textarea
    id: prompt
    attributes:
      label: Prompt
      description: What you asked the agent.
      render: text
  - type: textarea
    id: wrong
    attributes:
      label: What the agent wrote
      description: The wrong YAML, and the error or failing check if tinyprobe reported one.
      render: yaml
    validations:
      required: true
  - type: textarea
    id: right
    attributes:
      label: What it should have written
      description: If you know. Otherwise, what you expected it to do.
  - type: textarea
    id: notes
    attributes:
      label: Anything else
      description: How many attempts it took, whether it fixed the mistake by itself, what it skipped.
