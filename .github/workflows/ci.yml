name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, test & end-to-end
    runs-on: ubuntu-latest
    permissions:
      contents: read
      checks: write   # the JUnit report becomes a check with the test results

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore Tinyprobe.slnx

      - name: Build
        run: dotnet build Tinyprobe.slnx -c Release --no-restore

      - name: Unit tests
        run: dotnet test Tinyprobe.slnx -c Release --no-build

      # Publish the same Native AOT binary users get from a release, then run the
      # full example workflow with it against the local test server.
      - name: Install Native AOT prerequisites
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish Native AOT CLI
        run: dotnet publish src/Tinyprobe.Cli/Tinyprobe.Cli.csproj -c Release -r linux-x64 -o publish

      - name: Start test server
        run: |
          dotnet run --project tests/Tinyprobe.RealServer.Tests -c Release --no-build --urls http://localhost:5122 > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5122/api/public && exit 0
            sleep 1
          done
          echo "Test server did not start"; cat server.log; exit 1

      - name: End-to-end (docs/example/workflows)
        run: ./publish/tinyprobe run docs/example/workflows -e docs/environment.yaml --junit reports/tinyprobe.xml

      # The JUnit report (docs/specs/0007-junit-report.md), read the way users' CI reads it.
      - name: Upload the JUnit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tinyprobe-junit
          path: reports/tinyprobe.xml

      - name: Publish the JUnit report
        if: always()
        uses: mikepenz/action-junit-report@v5
        with:
          report_paths: reports/tinyprobe.xml
          check_name: tinyprobe (docs/example)

      # The JSON protocol (docs/protocol.md) read by tools, on the Native AOT binary.
      - name: End-to-end (inspect, call, ndjson)
        run: |
          ./publish/tinyprobe inspect docs/example/api/testserver.yaml
          ./publish/tinyprobe inspect docs/example/workflows/users.yaml --json | jq -e '.valid and .kind == "workflow" and (.steps | length) > 0'
          ./publish/tinyprobe call docs/example/api/testserver.yaml status --with code=404 -e docs/environment.yaml
          ./publish/tinyprobe run docs/example/workflows/users.yaml -e docs/environment.yaml --reporter ndjson > events.ndjson
          jq -e -s '.[0].event == "run_started" and .[-1].event == "run_finished" and .[-1].success' events.ndjson
          ./publish/tinyprobe run docs/example -e docs/environment.yaml --reporter ndjson > suite.ndjson
          jq -e -s '.[0].event == "suite_started" and (.[0].files | length) == 7 and .[-1].event == "suite_finished" and .[-1].success' suite.ndjson

      - name: End-to-end (schema)
        run: ./publish/tinyprobe schema | jq -e '."$defs".step.properties.call and (.properties.steps.items."$ref" == "#/$defs/step")'

      # The MCP server (docs/specs/0005-mcp-server.md) on the Native AOT binary: a short session.
      - name: End-to-end (mcp)
        run: |
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2025-06-18"}}' \
            '{"jsonrpc":"2.0","method":"notifications/initialized"}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/list"}' \
            '{"jsonrpc":"2.0","id":3,"method":"tools/call","params":{"name":"run","arguments":{"paths":["docs/example/workflows"],"env_file":"docs/environment.yaml"}}}' \
            | ./publish/tinyprobe mcp > mcp.ndjson
          jq -e -s 'length == 3 and .[0].result.serverInfo.name == "tinyprobe" and (.[1].result.tools | length) == 4 and (.[2].result.isError | not) and (.[2].result.content[0].text | fromjson | .success and (.workflows | length) == 7)' mcp.ndjson

      - name: End-to-end (init)
        run: |
          dir=$(mktemp -d)
          ./publish/tinyprobe init "$dir"
          ./publish/tinyprobe init "$dir" --no-color | grep -q '= tinyprobe/env.local.yaml'
          test -d "$dir/tinyprobe/workflows" && grep -q 'tinyprobe guide' "$dir/AGENTS.md" && grep -qx '!tinyprobe/env.example.yaml' "$dir/.gitignore"

      # The GitHub Action of this repository (action.yml), with the binary just built.
      - name: GitHub Action
        uses: ./
        with:
          tinyprobe-path: ./publish/tinyprobe
          path: docs/example/workflows
          env-file: docs/environment.yaml
          junit: reports/action.xml

      - name: A failing workflow for the GitHub Action
        run: |
          mkdir -p reports/failing
          printf 'name: Failing on purpose\nimport: [../../docs/example/api/testserver.yaml]\nsteps:\n  - name: Public is 201\n    call: public\n    expect:\n      status: 201\n' > reports/failing/failing.yaml

      - name: GitHub Action, failing workflow
        id: failing
        continue-on-error: true
        uses: ./
        with:
          tinyprobe-path: ./publish/tinyprobe
          path: reports/failing
          env-file: docs/environment.yaml
          junit: reports/failing.xml
          annotations: 'false'
          summary: 'false'

      - name: The failing run failed the step, with exit code 1
        env:
          OUTCOME: ${{ steps.failing.outcome }}
          EXIT_CODE: ${{ steps.failing.outputs.exit-code }}
        run: |
          test "$OUTCOME" = failure && test "$EXIT_CODE" = 1
          grep -q 'failures="1"' reports/failing.xml

      - name: Test server log
        if: failure()
        run: cat server.log || true

  # The Docker image (docker/Dockerfile) with an Alpine binary built from these sources, as the Release
  # workflow builds it: the example workflows over the host network, a JUnit report written into the mounted
  # folder by the caller's user, and an HTTPS request.
  docker:
    name: Docker image (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - { platform: linux/amd64, rid: linux-musl-x64,   os: ubuntu-latest }
          - { platform: linux/arm64, rid: linux-musl-arm64, os: ubuntu-24.04-arm }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Start test server
        run: |
          dotnet build tests/Tinyprobe.RealServer.Tests -c Release
          dotnet run --project tests/Tinyprobe.RealServer.Tests -c Release --no-build --urls http://localhost:5122 > server.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf -o /dev/null http://localhost:5122/api/public && exit 0
            sleep 1
          done
          echo "Test server did not start"; cat server.log; exit 1

      - name: Publish Native AOT for Alpine
        run: docker/publish-musl.sh ${{ matrix.rid }} docker/${{ matrix.platform }}

      - name: Build the image
        run: |
          docker build -t tinyprobe:ci docker
          docker image ls tinyprobe:ci

      - name: End-to-end in the image
        run: |
          mkdir -p reports
          docker run --rm --network host --user "$(id -u):$(id -g)" -v "$PWD:/work" tinyprobe:ci \
            run docs/example/workflows -e docs/environment.yaml --junit reports/docker.xml
          test "$(stat -c %u reports/docker.xml)" = "$(id -u)"
          grep -q 'failures="0" errors="0"' reports/docker.xml
          docker run --rm -v "$PWD:/work" tinyprobe:ci run docker/test/https.yaml

      - name: Test server log
        if: failure()
        run: cat server.log || true
