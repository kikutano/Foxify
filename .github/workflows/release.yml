name: Release

# Push a SemVer tag to publish a release, e.g.:
#   git tag -a v0.5.0 --cleanup=whitespace -F notes.md
#   git push origin v0.5.0
# The tag message after its first line is used as the top of the release notes.
# --cleanup=whitespace keeps Markdown headings: by default git drops lines starting with '#'.
# Tags with a suffix (v0.2.0-beta.1) are published as pre-releases.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test Foxify.slnx -c Release

  build:
    name: Build (${{ matrix.rid }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest }
          - { rid: linux-x64,   os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-arm64,   os: macos-latest }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish Native AOT
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish src/Foxify.Cli/Foxify.Cli.csproj -c Release -r ${{ matrix.rid }} -o publish -p:Version="$VERSION"

      - name: Smoke test
        shell: bash
        run: ./publish/foxify --version

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/foxify.exe -DestinationPath dist/foxify-${{ matrix.rid }}.zip

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf dist/foxify-${{ matrix.rid }}.tar.gz -C publish foxify

      - uses: actions/upload-artifact@v4
        with:
          name: foxify-${{ matrix.rid }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The body of an annotated tag (everything after its first line) goes on top of the
      # generated notes. A lightweight tag, or one with a single line, adds nothing.
      - name: Release notes from the tag message
        run: |
          # Fetch the tag object itself: a shallow checkout may not carry the annotation.
          git fetch --force --depth 1 origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/tag-notes.md"
          cat "${RUNNER_TEMP}/tag-notes.md"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Checksums
        working-directory: dist
        run: sha256sum foxify-* > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/tag-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}
