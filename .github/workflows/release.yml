name: Release

# Push a SemVer tag to publish a release, e.g.:
#   git tag -a v0.5.0 --cleanup=whitespace -F notes.md
#   git push origin v0.5.0
# The tag message after its first line is used as the top of the release notes.
# --cleanup=whitespace keeps Markdown headings: by default git drops lines starting with '#'.
# Tags with a suffix (v0.2.0-beta.1) are published as pre-releases.
on:
  push:
    tags: ['v*.*.*']

permissions:
  contents: write

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet test Tinyprobe.slnx -c Release

  build:
    name: Build (${{ matrix.rid }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: win-x64,     os: windows-latest }
          - { rid: linux-x64,   os: ubuntu-latest }
          - { rid: linux-arm64, os: ubuntu-24.04-arm }
          - { rid: osx-arm64,   os: macos-latest }

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Install Native AOT prerequisites
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y clang zlib1g-dev

      - name: Publish Native AOT
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          dotnet publish src/Tinyprobe.Cli/Tinyprobe.Cli.csproj -c Release -r ${{ matrix.rid }} -o publish -p:Version="$VERSION"

      - name: Smoke test
        shell: bash
        run: ./publish/tinyprobe --version

      - name: Package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Compress-Archive -Path publish/tinyprobe.exe -DestinationPath dist/tinyprobe-${{ matrix.rid }}.zip

      - name: Package (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p dist
          tar -czf dist/tinyprobe-${{ matrix.rid }}.tar.gz -C publish tinyprobe

      - uses: actions/upload-artifact@v4
        with:
          name: tinyprobe-${{ matrix.rid }}
          path: dist/*

  # Alpine (musl): for Alpine-based CI images, and the binaries of the Docker image.
  build-musl:
    name: Build (${{ matrix.rid }})
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - { rid: linux-musl-x64,   os: ubuntu-latest }
          - { rid: linux-musl-arm64, os: ubuntu-24.04-arm }

    steps:
      - uses: actions/checkout@v4

      - name: Publish Native AOT (smoke test included)
        run: docker/publish-musl.sh ${{ matrix.rid }} publish "${GITHUB_REF_NAME#v}"

      - name: Package
        run: |
          mkdir -p dist
          tar -czf dist/tinyprobe-${{ matrix.rid }}.tar.gz -C publish tinyprobe

      - uses: actions/upload-artifact@v4
        with:
          name: tinyprobe-${{ matrix.rid }}
          path: dist/*

  release:
    name: Publish GitHub Release
    needs: [build, build-musl]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The body of an annotated tag (everything after its first line) goes on top of the
      # generated notes. A lightweight tag, or one with a single line, adds nothing.
      - name: Release notes from the tag message
        run: |
          # Fetch the tag object itself: a shallow checkout may not carry the annotation.
          git fetch --force --depth 1 origin "refs/tags/${GITHUB_REF_NAME}:refs/tags/${GITHUB_REF_NAME}"
          git tag -l --format='%(contents:body)' "${GITHUB_REF_NAME}" > "${RUNNER_TEMP}/tag-notes.md"
          cat "${RUNNER_TEMP}/tag-notes.md"

      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      # Editors and agents can pin the schema of the version they use (docs/specs/0006-completion-and-hover.md).
      - name: JSON Schema of the format
        run: cp docs/schema/tinyprobe.schema.json dist/

      - name: Checksums
        working-directory: dist
        run: sha256sum tinyprobe-* > SHA256SUMS && cat SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: ${{ runner.temp }}/tag-notes.md
          generate_release_notes: true
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ghcr.io/kikutano/tinyprobe:X.Y.Z, X.Y and latest, from the musl binaries of this release.
  docker:
    name: Docker image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: tinyprobe-linux-musl-*
          path: dist
          merge-multiple: true

      - name: Build context
        run: |
          mkdir -p docker/linux/amd64 docker/linux/arm64
          tar -xzf dist/tinyprobe-linux-musl-x64.tar.gz -C docker/linux/amd64
          tar -xzf dist/tinyprobe-linux-musl-arm64.tar.gz -C docker/linux/arm64

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A pre-release gets only its exact tag: latest and X.Y stay on the last stable release.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=tinyprobe
            org.opencontainers.image.description=API testing from the command line: endpoints and workflows in YAML.
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v6
        with:
          context: docker
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Pulled without credentials, as users do: this fails while the package is still private on GHCR.
      - name: Smoke test (anonymous pull, HTTPS)
        run: |
          docker logout ghcr.io
          image="ghcr.io/${{ github.repository }}:${GITHUB_REF_NAME#v}"
          docker run --rm "$image" --version | grep -qx "${GITHUB_REF_NAME#v}"
          docker run --rm -v "$PWD:/work" "$image" run docker/test/https.yaml

  # ghcr.io/kikutano/tinyprobe-testserver:X.Y.Z, X.Y and latest: the server of docs/example, so the examples of
  # this release run without the .NET SDK. Same tags as the tinyprobe image.
  testserver:
    name: Test server image
    needs: release
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}-testserver
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
          labels: |
            org.opencontainers.image.title=tinyprobe test server
            org.opencontainers.image.description=The test server of the tinyprobe examples. Fixed credentials on purpose: publish it on 127.0.0.1 only.
            org.opencontainers.image.licenses=MIT

      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/testserver/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}

      # Pulled without credentials, as users do: this fails while the package is still private on GHCR.
      - name: Smoke test (anonymous pull)
        run: |
          docker logout ghcr.io
          docker run -d --name testserver -p 127.0.0.1:5122:5122 "ghcr.io/${{ github.repository }}-testserver:${GITHUB_REF_NAME#v}"
          for i in $(seq 1 60); do
            curl -sf http://localhost:5122/api/public && exit 0
            sleep 1
          done
          echo "Test server did not start"; docker logs testserver; exit 1

  # Users pin `kikutano/tinyprobe@vX.Y.Z`: the action of this release, with its binary, on every OS.
  action:
    name: GitHub Action
    needs: release
    uses: ./.github/workflows/action.yml
    with:
      version: ${{ github.ref_name }}
