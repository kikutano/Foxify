name: Catalog
description: Assertions on a deeply nested JSON response.

import:
  - ../api/testserver.yaml

steps:
  - use: ../sequences/log-in.yaml   # the shared login: saves ${token}
    with:
      password: password

  - name: Catalog structure
    call: catalog
    expect:
      status: 200
      body:
        $.catalog.name: tinyprobe Test Catalog
        $.catalog.metadata.created_by.username: admin
        $.catalog.categories[0].name: { in: [Hardware, Software] }
        $.catalog.categories[0].products[0].name: Keyboard
        $.catalog.categories[0].products[0].price: 99.99
        $.catalog.categories[0].products[0].specifications.features[0]: mechanical
        $.catalog.categories[1].name: Software
        $.catalog.categories[1].products[0].specifications.platforms: { contains: windows }
