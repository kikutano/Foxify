name: HTTP features
description: Query strings, request and response headers, status codes and slow responses.

import:
  - ../api/testserver.yaml
  - probe: ../api/probe.yaml          # a named import: its endpoints are probe.health, probe.public

settings:
  timeout: 10
  max_retries: 0

steps:
  - use: ../sequences/log-in.yaml   # the shared login: saves ${token}
    with:
      password: password

  - name: Health of the other API file
    call: probe.health
    expect:
      body:
        $.status: ok

  - call: probe.public                 # not the `public` of testserver.yaml
    expect:
      body:
        $.authenticated: false

  - name: Echo returns what was sent
    call: echo
    with:
      source: tinyprobe
      mode: test
      customHeader: custom-value
      correlationId: tinyprobe-test-001
      payload:
        message: Hello from tinyprobe
        nested:
          enabled: true
          values: [1, 2, 3]
    expect:
      status: 200
      body:
        $.method: POST
        $.query.source: tinyprobe
        $.headers.X-Custom-Header: custom-value
        $.headers.X-Correlation-Id: tinyprobe-test-001

  - name: Response headers
    call: response_headers
    expect:
      status: 200
      headers:
        X-Custom-Header: hello-world
        X-Test-Request-Id: { matches: '^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$' }   # a UUID
      body:
        $.message: Response contains custom headers.

  # The same endpoint, one step per status code.
  - { call: status, with: { code: 200 }, expect: { status: 200, body: { $.status: 200 } } }
  - { call: status, with: { code: 400 }, expect: { status: 400 } }
  - { call: status, with: { code: 403 }, expect: { status: 403 } }
  - { call: status, with: { code: 500 }, expect: { status: 500 } }
  - { call: status, with: { code: 503 }, expect: { status: 503 } }

  - sleep: 200ms

  - name: Slow response
    call: delay
    with:
      milliseconds: 500
    expect:
      status: 200
      duration: { lt: 2s }
      body:
        $.delayed: true
        $.milliseconds: 500
