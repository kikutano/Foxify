name: Authentication
description: Public access, login, bearer token and API key.

import:
  - ../api/testserver.yaml

steps:
  - name: Public endpoint needs no auth
    call: public
    expect:
      status: 200
      body:
        $.message: This endpoint is public.
        $.authenticated: false

  - name: Admin logs in
    call: login
    with:
      password: password
    expect:
      status: 200
      body:
        $.access_token: tinyprobe-test-token
        $.token_type: Bearer
        $.expires_in: 3600
        $.user.username: admin
    save:
      token: $.access_token

  - name: Wrong password is rejected
    call: login
    with:
      password: wrong-password
    expect:
      status: 401
      body:
        $.error: invalid_credentials

  - name: Bearer token is accepted
    call: bearer_check
    expect:
      status: 200
      body:
        $.authenticated: true
        $.authentication: bearer

  - name: Invalid bearer token is rejected
    call: bearer_check
    with:
      token: invalid-token        # arguments shadow saved variables for this step only
    expect:
      status: 401
      body:
        $.error: unauthorized

  - name: API key is accepted
    call: apikey_check
    expect:
      status: 200
      body:
        $.authenticated: true
        $.authentication: api-key

  - name: Bearer token and API key together
    call: both_check
    expect:
      status: 200
      body:
        $.authenticated: true

  - name: Basic auth is accepted
    call: basic_check
    with:
      password: password
    expect:
      status: 200
      body:
        $.authentication: basic
        $.username: admin

  - name: Basic auth with a wrong password is rejected
    call: basic_check
    with:
      password: wrong-password
    expect:
      status: 401
      headers:
        WWW-Authenticate: { contains: Basic }

  - name: OAuth2 client credentials, client in a Basic header
    call: oauth_check                 # tinyprobe gets the token from /oauth/token first
    expect:
      status: 200
      body:
        $.authentication: oauth2
        $.scope: users:read users:write

  - name: OAuth2 client credentials, client in the form
    call: oauth_form_check
    expect:
      status: 200
      body:
        $.client_id: tinyprobe-client
        $.scope: ""

  - name: The token endpoint rejects a wrong secret
    call: oauth_token
    with:
      client_id: ${clientId}
      client_secret: wrong-secret
    expect:
      status: 401
      body:
        $.error: invalid_client
