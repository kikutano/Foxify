# API definition of the bundled test server (tests/Tinyprobe.RealServer.Tests).
# Endpoints only: no expectations here. Workflows import this file and call
# the endpoints by name, passing arguments with `with:`.

base_url: ${baseUrl}

# Reusable header sets, picked per endpoint with `auth:`.
auth:
  bearer:
    Authorization: "Bearer ${token}"
  apikey:
    X-API-Key: ${apiKey}
  basic:
    basic:                     # Authorization: Basic, computed by tinyprobe
      username: ${username}
      password: ${password}
  oauth:
    oauth2:                    # a token from the token URL, reused for the run
      token_url: ${baseUrl}oauth/token
      client_id: ${clientId}
      client_secret: ${clientSecret}
      scope: [users:read, users:write]
  oauth_form:
    oauth2:
      token_url: ${baseUrl}oauth/token
      client_id: ${clientId}
      client_secret: ${clientSecret}
      client_auth: form        # client_id and client_secret in the body

endpoints:
  # --- Authentication -------------------------------------------------------

  public:
    path: /api/public

  login:
    method: POST
    path: /api/login
    params:
      username: admin           # default, can be overridden with `with:`
      password:                 # no default: required
    body:
      username: ${username}
      password: ${password}

  basic_check:
    path: /api/auth/basic
    auth: basic
    params: { username: admin, password: }

  oauth_check:
    path: /api/auth/oauth
    auth: oauth

  oauth_form_check:
    path: /api/auth/oauth
    auth: oauth_form

  # The token endpoint itself, to test the authorization server's errors.
  oauth_token:
    method: POST
    path: /oauth/token
    params: { client_id:, client_secret: }
    form:
      grant_type: client_credentials
      client_id: ${client_id}
      client_secret: ${client_secret}

  bearer_check:
    path: /api/auth/bearer
    auth: bearer

  apikey_check:
    path: /api/auth/apikey
    auth: apikey

  both_check:
    path: /api/auth/both
    auth: [bearer, apikey]

  # --- Users ----------------------------------------------------------------

  list_users:
    path: /api/users
    query: [page, pageSize, active, search]   # each is sent only when passed
    auth: bearer

  list_users_nested:
    path: /api/users/list
    auth: bearer

  get_user:
    path: /api/users/${id}
    auth: bearer

  create_user:
    method: POST
    path: /api/users
    auth: bearer
    params:
      firstName:
      lastName:
      email:
      city: Bari
    body:
      firstName: ${firstName}
      lastName: ${lastName}
      email: ${email}
      address:
        street: Test Street 10
        city: ${city}
        zipCode: "70100"
        country: Italy

  replace_user:
    method: PUT
    path: /api/users/${id}
    auth: bearer
    params:
      id:
      firstName:
      lastName:
      email:
      active: true
      city:
    body:
      firstName: ${firstName}
      lastName: ${lastName}
      email: ${email}
      active: ${active}          # a lone placeholder keeps the argument's type: true, not "true"
      address:
        street: Updated Street 20
        city: ${city}
        zipCode: "00100"
        country: Italy

  patch_user:
    method: PATCH
    path: /api/users/${id}
    auth: bearer
    body: ${changes}             # the whole body is an argument

  delete_user:
    method: DELETE
    path: /api/users/${id}
    auth: bearer

  # --- Catalog --------------------------------------------------------------

  catalog:
    path: /api/catalog
    auth: bearer

  # --- HTTP features --------------------------------------------------------

  echo:
    method: POST
    path: /api/echo
    query: [source, mode]
    auth: bearer
    headers:
      X-Custom-Header: ${customHeader}
      X-Correlation-Id: ${correlationId}
    body: ${payload}

  response_headers:
    path: /api/headers

  status:
    path: /api/status/${code}

  delay:
    path: /api/delay/${milliseconds}

  # --- Forms and file uploads -----------------------------------------------

  # An HTML form: tinyprobe encodes the values and sets the Content-Type.
  submit_form:
    method: POST
    path: /api/form
    params: { name:, password:, tags: }
    form:
      name: ${name}
      password: ${password}
      tags: ${tags}                  # a list sends the field once per value

  # A file upload. File paths are relative to the workflow that runs.
  upload:
    method: POST
    path: /api/files
    params: { description:, avatar:, notes: }
    multipart:
      description: ${description}
      avatar:
        file: ${avatar}
      notes:
        file: ${notes}
        filename: notes.md
        content_type: text/markdown
      tags: [profile, public]

  # --- Cookie session -------------------------------------------------------

  # The server sets the session cookies; each workflow keeps them in its own
  # cookie jar and sends them with the next requests. Nothing to declare here.
  session_login:
    method: POST
    path: /api/session
    params: { username: admin, password: }
    body:
      username: ${username}
      password: ${password}

  # An HTML form login, answered with a redirect to session_me.
  session_form_login:
    method: POST
    path: /api/session/form
    params: { username: admin, password: }
    form:
      username: ${username}
      password: ${password}

  session_me:
    path: /api/session/me

  # A write protected against CSRF: the token is the XSRF-TOKEN cookie.
  session_note:
    method: POST
    path: /api/session/notes
    params: { csrf:, text: }
    headers:
      X-XSRF-TOKEN: ${csrf}
    body:
      text: ${text}

  session_logout:
    method: DELETE
    path: /api/session

  # --- Async jobs -------------------------------------------------------------

  # A report that is ready after a few reads: workflows wait for it with `until`.
  start_report:
    method: POST
    path: /api/jobs
    params:
      name:
      requestedAt:
    body:
      name: ${name}
      requestedAt: ${requestedAt}

  get_report:
    path: /api/jobs/${id}
